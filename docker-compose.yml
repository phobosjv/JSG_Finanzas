services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Permite que Caddy alcance servicios del host (Webmin:10000) y puertos
    # publicados por otros contenedores (Portainer:9443) vía host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - finanzas

  finanzas:
    build: .
    # Sin ports: el acceso externo pasa por Caddy vía la red Docker interna.
    # Para desarrollo local sin Docker: cd backend && uvicorn app.main:app --reload
    volumes:
      - finanzas-data:/data        # aquí vive finanzas.db y los backups
    environment:
      - DATABASE_URL=sqlite:////data/finanzas.db
      - SECRET_KEY=${SECRET_KEY}
      # En producción Docker el frontend lo sirve el propio FastAPI (mismo origen),
      # así que CORS normalmente no hace falta cambiar este valor.
      # Si accedes desde un dominio externo distinto al del servidor, añádelo aquí.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:5173"]}
      # Marca la cookie de sesión como Secure (obligatorio con HTTPS).
      # Poner true cuando DOMAIN es un dominio real con certificado SSL.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEBUG=${DEBUG:-false}
      # Usuario admin creado automáticamente en el primer arranque.
      # Cambia la contraseña tras el primer login.
      - ADMIN_DEFAULT_USER=${ADMIN_DEFAULT_USER:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin1234}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  finanzas-data:
  caddy-data:
  caddy-config:
