services:
  finanzas:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - finanzas-data:/data        # aquí vive finanzas.db y los backups
    environment:
      - DATABASE_URL=sqlite:////data/finanzas.db
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped

volumes:
  finanzas-data: