[alembic]
script_location = alembic
prepend_sys_path = .

# La URL real la sobreescribe env.py leyendo Settings.database_url
# Este valor solo se usa si se llama alembic sin pasar el config de env.py
sqlalchemy.url = sqlite:///./finanzas.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
