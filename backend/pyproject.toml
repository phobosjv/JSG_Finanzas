[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjs-finanzas"
version = "1.24.0"
requires-python = ">=3.10"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ORM y migraciones
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Configuracion
    "pydantic-settings>=2.0",
    # Datos de mercado.
    # Unica dependencia con techo: yfinance rompe su API entre majors
    # (el rango abierto ">=0.2" resolvio 1.6.0 el 2026-08-21, un salto de
    # major) y es la unica cuya integracion real NO cubren los tests, que
    # la mockean. Subir el techo es una decision deliberada: probar contra
    # Yahoo antes de tocarlo.
    "yfinance>=1.6,<2.0",
    # Tipos de cambio del BCE (parsing XML)
    "httpx>=0.27",
    # Tareas en segundo plano
    "apscheduler>=3.10",
    # Auth
    "bcrypt>=4.0",
    "itsdangerous>=2.2",       # firma de la cookie de sesion
    # Plantilla HTML del informe fiscal
    "jinja2>=3.1",
    # Notificaciones push (Web Push Protocol)
    "pywebpush>=2.0",
    "cryptography>=40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",             # TestClient de FastAPI
    "fpdf2>=2.7",              # manual PDF (gen_instrucciones.py)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
