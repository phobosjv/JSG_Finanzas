[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjs-finanzas"
version = "1.19.2"
requires-python = ">=3.10"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ORM y migraciones
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Configuracion
    "pydantic-settings>=2.0",
    # Datos de mercado
    "yfinance>=0.2",
    # Tipos de cambio del BCE (parsing XML)
    "httpx>=0.27",
    # Tareas en segundo plano
    "apscheduler>=3.10",
    # Auth
    "bcrypt>=4.0",
    "itsdangerous>=2.2",       # firma de la cookie de sesion
    # Plantilla HTML del informe fiscal
    "jinja2>=3.1",
    # Notificaciones push (Web Push Protocol)
    "pywebpush>=2.0",
    "cryptography>=40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",             # TestClient de FastAPI
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
